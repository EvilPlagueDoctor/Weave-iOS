name: WeaveIOS
options:
  bundleIdPrefix: app.weave
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    DEVELOPMENT_TEAM: ""
targets:
  WeaveIOS:
    type: application
    platform: iOS
    sources:
      - path: WeaveIOS
        excludes:
          - Resources/ReferenceAndroid
    resources:
      - path: WeaveIOS/Resources
        excludes:
          - ReferenceAndroid
    dependencies:
      - framework: Native/VeilKnit.xcframework
        embed: false
    info:
      path: WeaveIOS/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.weave.ios
        PRODUCT_NAME: Weave
        SWIFT_OBJC_BRIDGING_HEADER: WeaveIOS/WeaveIOS-Bridging-Header.h
        HEADER_SEARCH_PATHS: "$(SRCROOT)/Native/include"
        CODE_SIGNING_ALLOWED: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_LDFLAGS: "$(inherited) -lc++"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
    scheme:
      testTargets: []
